<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No encontramos esa página — Blink Web Services</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <style>
      /* Mismo criterio que el 404 de blink.com.ve: hoja en línea, sin
         arrancar el bundle, para que una ruta rota no dependa de que el
         JS cargue. La marca es el isotipo aprobado, sin tocar un dato. */
      :root {
        --azul: #007aff;
        --tinta: #1d1d1f;
        --tinta-2: #424242;
        --fondo: #f2f2f7;
        --pila: "SF Pro", "SF Pro Text", "SF Pro Display", "Inter", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, "Helvetica Neue", Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--pila);
        font-optical-sizing: auto;
        background: var(--fondo);
        color: var(--tinta);
        text-align: center;
        padding: 32px;
      }
      main {
        max-width: 620px;
      }
      svg {
        width: 132px;
        height: auto;
        display: block;
        margin: 0 auto 34px;
        color: var(--azul);
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 12px;
      }
      p {
        margin: 0 auto 28px;
        max-width: 30em;
        font-size: 1.0625rem;
        line-height: 1.5;
        color: var(--tinta-2);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 13px 26px;
        border-radius: 999px;
        background: #0066cc; /* --color-action-fill: blanco encima = 5,6:1 */
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.08);
      }
      a:focus-visible {
        outline: 2px solid var(--azul);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="76 114 360 284" fill="currentColor" role="img" aria-label="Blink">
        <path
          d="M 122 164 H 178 C 198 164 224 164 224 198 C 224 232 198 232 178 232 H 122 C 102 232 76 232 76 198 C 76 164 102 164 122 164 Z"
        />
        <path d="M 436 182 A 68 68 0 1 1 299.99 182 A 68 68 0 1 1 436 182 Z" />
        <path
          d="M 212 286 H 300 C 331.55 286 340.42 286 337.5 314 C 332.064081 366.125250 298 398 256 398 C 214 398 179.935919 366.125250 174.5 314 C 171.58 286 180.45 286 212 286 Z"
        />
      </svg>
      <h1>No encontramos esa página.</h1>
      <p>
        Puede que el enlace haya cambiado. Vuelve al inicio de Blink Web
        Services y cuéntanos qué quieres montar.
      </p>
      <a href="/">Ir al inicio</a>
    </main>
  </body>
</html>
